[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackless-sdk"
version = "0.1.7"
description = "CLI-backed Python SDK for stackless lifecycle verbs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
authors = [{ name = "stackless contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
keywords = ["stackless", "ephemeral", "infrastructure", "testing", "cli"]

[project.urls]
Homepage      = "https://github.com/snowmead/stackless"
Repository    = "https://github.com/snowmead/stackless"
Issues        = "https://github.com/snowmead/stackless/issues"
Documentation = "https://github.com/snowmead/stackless/tree/main/sdks/python"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/stackless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
