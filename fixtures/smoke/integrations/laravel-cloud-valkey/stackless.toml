# Live smoke: provisions `laravel_cloud/valkey` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-laravel-cloud-valkey
# One-time: `stripe projects link laravel_cloud` (account-level).

[stack]
name = "smoke-laravel-cloud-valkey"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.cache]
provider      = "laravel-cloud-valkey"
instance_size = "valkey-flex-250mb"
region        = "us-east-1"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.cache.redis_url}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
