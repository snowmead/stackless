# Live smoke: provisions `inngest/app` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-inngest
# One-time: `stripe projects link inngest` (account-level).

[stack]
name = "smoke-inngest"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.app]
provider = "inngest"
id       = "stackless-smoke"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.app.event_key}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
