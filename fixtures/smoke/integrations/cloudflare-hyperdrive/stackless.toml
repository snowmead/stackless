# Live smoke: provisions `cloudflare/hyperdrive` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-cloudflare-hyperdrive
# One-time: `stripe projects link cloudflare` (account-level).

[stack]
name = "smoke-cloudflare-hyperdrive"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.hyperdrive]
provider = "cloudflare-hyperdrive"
name     = "stackless-smoke-${instance.name}"
database = "stackless-smoke"
host     = "stackless-smoke"
password = "stackless-smoke"
port     = "1"
scheme   = "postgres"
user     = "stackless-smoke"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.hyperdrive.hyperdrive_id}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
