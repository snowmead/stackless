# Live smoke: provisions `wordpress.com/site` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-wordpress-com
# One-time: `stripe projects link wordpress.com` (account-level).

[stack]
name = "smoke-wordpress-com"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.site]
provider = "wordpress-com"
plan     = "free"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.site.site_url}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
