# Live smoke: provisions `elevenlabs/tts` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-elevenlabs
# One-time: `stripe projects link elevenlabs` (account-level).

[stack]
name = "smoke-elevenlabs"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.tts]
provider = "elevenlabs"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.tts.api_key}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
