# Live smoke: provisions `blaxel/agent-drive` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-blaxel-agent-drive
# One-time: `stripe projects link blaxel` (account-level).

[stack]
name = "smoke-blaxel-agent-drive"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.resource]
provider = "blaxel-agent-drive"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.resource.api_key}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
