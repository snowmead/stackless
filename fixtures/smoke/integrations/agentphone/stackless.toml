# Live smoke: provisions `agentphone/number` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-agentphone
# One-time: `stripe projects link agentphone` (account-level).

[stack]
name = "smoke-agentphone"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.phone]
provider   = "agentphone"
agent_name = "stackless-smoke"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.phone.phone_number}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
