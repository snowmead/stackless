# Live smoke: provisions `sentry/seer` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-sentry-seer
# One-time: `stripe projects link sentry` (account-level).

[stack]
name = "smoke-sentry-seer"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.seer]
provider = "sentry-seer"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.seer.auth_token}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
