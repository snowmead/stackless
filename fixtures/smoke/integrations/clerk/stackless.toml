# Live smoke: provisions `clerk/auth` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-clerk
# One-time: `stripe projects link clerk` (account-level).

[stack]
name = "smoke-clerk"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.auth]
provider       = "clerk"
app_name       = "stackless-smoke-${instance.name}"
credential_set = "development"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.auth.secret_key}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
