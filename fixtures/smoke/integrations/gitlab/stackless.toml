# Live smoke: provisions `gitlab/project` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-gitlab
# One-time: `stripe projects link gitlab` (account-level).

[stack]
name = "smoke-gitlab"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.project]
provider   = "gitlab"
name       = "stackless-smoke-${instance.name}"
visibility = "private"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.project.project_id}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
