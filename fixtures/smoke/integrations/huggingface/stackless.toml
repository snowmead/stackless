# Live smoke: provisions `huggingface/platform` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-huggingface
# One-time: `stripe projects link huggingface` (account-level).

[stack]
name = "smoke-huggingface"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.platform]
provider = "huggingface"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.platform.token}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
