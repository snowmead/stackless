# Live smoke: provisions `clickhouse/clickhouse` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-clickhouse
# One-time: `stripe projects link clickhouse` (account-level).

[stack]
name = "smoke-clickhouse"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.resource]
provider           = "clickhouse"
name               = "stackless-smoke-${instance.name}"
region             = "aws-us-west-2"
minReplicaMemoryGb = "1"
maxReplicaMemoryGb = "1"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.resource.connection_string}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
