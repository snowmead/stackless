# Live smoke: provisions `upstash/vector` through Stripe Projects
# under `--on local`. Run via:
#   mise run smoke-integration-upstash-vector
# One-time: `stripe projects link upstash` (account-level).

[stack]
name = "smoke-upstash-vector"

[stack.projects]
[stack.projects.stripe]
# project anchor recorded on first successful `up`

[integrations.vector]
provider = "upstash-vector"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-smoke-ok" }
env         = { PROBE = "${integrations.vector.rest_url}" }

[services.web.local]
run = "sh -c 'd=$(mktemp -d); printf stackless-smoke-ok > \"$d/index.html\"; exec python3 -m http.server $PORT --bind 127.0.0.1 --directory \"$d\"'"
