[tools]
rust                  = "1.96.0"
taplo                 = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-audit"   = "latest"
"cargo:cargo-deny"    = "latest"
"cargo:cargo-vet"     = "latest"
"cargo:cargo-dist"    = "latest"
prek                  = "latest" # pre-commit runner; [hooks] below auto-wires it

[tasks]
# Formatting & lint (keep clippy/fmt wired even if not "crap" tools)
fmt    = "cargo fmt --all -- --check"
clippy = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
taplo  = "taplo fmt --check --diff"
# Testing — `--all-features` matches clippy and runs the `test-support`-gated
# fixtures (e.g. stackless-git's `flow` test, which needs `build_repo`).
test = "cargo nextest run --workspace --all-features"
# "Cargo crap" / supply chain (the point of the request)
# cargo-audit doesn't read deny.toml, so mirror its [advisories].ignore here
# (libsql's pinned old rustls stack — rustls-webpki / rustls-pemfile).
audit        = "cargo audit --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0134"
deny         = "cargo deny check"
vet          = "cargo vet"
supply-chain = { depends = ["audit", "deny", "vet"] }
# One-command local gate (mirrors what CI will do)
check = { depends = ["fmt", "clippy", "taplo"] }
ci    = { depends = ["check", "test", "supply-chain"] }

# Live cloud smokes — gated on real provider creds, EXCLUDED from `ci` (which
# stays hermetic). Locally they read tokens from .stackless.env; in CI the
# workflow injects STRIPE_API_KEY / VERCEL_TOKEN / RENDER_API_KEY as secrets. All
# three share `fixtures/smoke/run.sh`: a real up, then ALWAYS a teardown, with a
# unique per-run instance name; the task fails if up (health) or down (verified-
# gone) fails. Cloudflare is a catalog integration, so it provisions R2+KV under
# `--on local` (needs `stripe projects link cloudflare`, account-level).
smoke-vercel     = "bash fixtures/smoke/run.sh vercel fixtures/smoke/vercel/stackless.toml smoke-v"
smoke-render     = "bash fixtures/smoke/run.sh render fixtures/smoke/render/stackless.toml smoke-r"
smoke-cloudflare = "bash fixtures/smoke/run.sh local fixtures/smoke/cloudflare/stackless.toml smoke-c"
smoke            = { depends = ["smoke-vercel", "smoke-render", "smoke-cloudflare"] }

# Stripe Projects plugin snapshots. `stripe-refresh` is the bless path (writes
# the committed fixtures from the locally installed plugin); it needs the real
# `stripe` CLI + creds, so it is EXCLUDED from `ci`/`check`/`test` and is invoked
# by the CI watcher, not by hand. `stripe-coherence` is the fast, offline
# pre-commit check (it also runs inside `mise run test`).
stripe-refresh = '''
[ -f .stackless.env ] && { set -a; . ./.stackless.env; set +a; }
STRIPE_PROJECTS_REFRESH=1 cargo nextest run -p stackless-stripe-projects --all-features -E 'test(refresh_blesses_snapshots)' --no-capture
'''
stripe-coherence = "cargo nextest run -p stackless-stripe-projects -E 'test(fixtures_are_coherent)'"
# Regenerate the vendored OpenAPI client crates (body stays shell — python +
# cargo-progenitor glue with no Rust types to reuse).
regen-clients = "bash specs/regen-clients.sh"

# Provider-onboarding tooling (the `xtask` crate). `catalog` is offline (reads the
# committed catalog fixture); `discover` is live — it provisions a resource into a
# throwaway environment to capture its real credential envelope, so it needs creds
# (STRIPE_API_KEY) and a dir with a linked project (default cwd; pass `-- --dir ...`).
# e.g. `mise run catalog cloudflare`, `mise run discover cloudflare/kv -- --dir fixtures/smoke/cloudflare`
catalog = "cargo run -q -p xtask -- catalog"
new-integration = "cargo run -q -p xtask -- new-integration"
discover = '''
[ -f .stackless.env ] && { set -a; . ./.stackless.env; set +a; }
cargo run -q -p xtask -- discover "$@"
'''

# Install the prek git hooks by hand (normally auto-wired by [hooks].postinstall).
hooks = "prek install -t pre-commit -t pre-push -f"

# Auto-wire the prek git hooks after `mise install` — the bootstrap devs and CI
# already run — so the pre-commit/pre-push gates need no separate setup step.
# Best-effort: a hiccup here must never fail `mise install`.
[hooks]
postinstall = "prek install -t pre-commit -t pre-push -f || true"

[settings]
# Required for [hooks] (auto-installing the prek git hooks above).
experimental = true
