[package]
name                 = "stackless-vercel"
edition.workspace    = true
version.workspace    = true
license.workspace    = true
repository.workspace = true
description          = "Vercel hosting substrate for stackless"

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
vercel-client = { path = "../vercel-client", version = "0.2.0" }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "charset",
    "http2",
    "json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stackless-cloud.workspace = true
stackless-core.workspace = true
stackless-git.workspace = true
stackless-integrations.workspace = true
stackless-stripe-projects.workspace = true
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "time", "macros", "process"] }
toml = "1.1.2"

[dev-dependencies]
stackless-core            = { path = "../stackless-core" }
stackless-stripe-projects = { workspace = true, features = ["test-support"] }
wiremock                  = "0.6.5"
