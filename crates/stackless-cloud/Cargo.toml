[package]
name                 = "stackless-cloud"
edition.workspace    = true
version.workspace    = true
license.workspace    = true
repository.workspace = true
description          = "Shared cloud substrate helpers for stackless"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "charset",
    "http2",
    "json",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stackless-core.workspace = true
stackless-git.workspace = true
stackless-stripe-projects.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
