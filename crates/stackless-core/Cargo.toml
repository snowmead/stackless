[package]
name                 = "stackless-core"
edition.workspace    = true
version.workspace    = true
license.workspace    = true
repository.workspace = true
description          = "Definition model, state store, and lifecycle engine for stackless"

[lints]
workspace = true

[dependencies]
async-trait  = "0.1.89"
base64       = "0.22.1"
futures-util = "0.3.32"
oxgraph      = { version = "0.4.3", features = ["algo-alloc", "graph-build"] }
rusqlite     = { version = "0.40.1", features = ["bundled"] }
rustix       = { version = "1.1.4", features = ["process", "fs"] }
serde        = { version = "1.0.228", features = ["derive"] }
serde_json   = "1.0.150"
sha2         = "0.10.9"
sysinfo      = "0.39.3"
thiserror    = "2.0.18"
tokio        = { version = "1.52.3", features = ["rt", "macros", "time", "sync"] }
toml         = "1.1.2"
url          = "2.5.8"
uuid         = { version = "1.18.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio    = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
