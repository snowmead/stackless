name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, platform-independent formatting/linting gates.
  # These give quick feedback and can fail the PR early.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: |
          mise install && exit 0
          for i in 1 2; do echo "retry $i (force)"; sleep 10; mise install --force && exit 0; done
          exit 1

      - name: cargo fmt
        run: mise run fmt

      - name: taplo
        run: mise run taplo

  # Compilation-based lints. Run on all supported OSes so we catch
  # platform-specific warnings.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: |
          mise install && exit 0
          for i in 1 2; do echo "retry $i (force)"; sleep 10; mise install --force && exit 0; done
          exit 1

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: clippy
        run: mise run clippy

  # The main test suite. Runs on all supported OSes.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: |
          mise install && exit 0
          for i in 1 2; do echo "retry $i (force)"; sleep 10; mise install --force && exit 0; done
          exit 1

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: nextest
        run: mise run test

  # Supply-chain / "cargo crap" security & policy gates.
  # These are not OS-specific, so we run them once on the fastest runner.
  # They are completely independent of the other jobs.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: |
          mise install && exit 0
          for i in 1 2; do echo "retry $i (force)"; sleep 10; mise install --force && exit 0; done
          exit 1

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo audit
        run: mise run audit

      - name: cargo deny
        run: mise run deny

      - name: cargo vet
        run: mise run vet
