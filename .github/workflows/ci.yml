name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast, platform-independent formatting/linting gates.
  # These give quick feedback and can fail the PR early.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh

      - name: cargo fmt
        run: mise run fmt

      - name: taplo
        run: mise run taplo

  # Compilation-based lints. Run on all supported OSes so we catch
  # platform-specific warnings.
  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: clippy
        run: mise run clippy

  # The main test suite. Runs on all supported OSes.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: nextest
        run: mise run test

  agent-demo-lifecycle:
    name: agent-demo-lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh
      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: agent-demo lifecycle JSON gate
        run: bash fixtures/agent-demo-lifecycle.sh

  # CLI-backed language SDKs (unit tests; CLI runner mocked).
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

      - name: Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Go SDK
        working-directory: sdks/go
        run: go test ./...

  # Supply-chain / "cargo crap" security & policy gates.
  # These are not OS-specific, so we run them once on the fastest runner.
  # They are completely independent of the other jobs.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a cold cache, mise's PARALLEL rustup component installs race/corrupt
      # downloads ("could not rename ... os error 2", lzma/checksum) and then hit
      # "detected conflict: bin/cargo-clippy". Install the mise CLI only, then
      # install tools SERIALLY (MISE_JOBS=1) with a force-retry. (cache: false to
      # also avoid the stale-toolchain variant; jdx/mise-action#215/#237.)
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo audit
        run: mise run audit

      - name: cargo deny
        run: mise run deny

      - name: cargo vet
        run: mise run vet

  # Tier-2 live smokes: real up/status/logs/down against hosting substrates.
  # Gated to the canonical repo (secrets live in GitHub Actions, not forks).
  # Cloudflare is nightly-only (smoke.yml) — PR runs hit account rate limits.
  live-smoke:
    name: live-smoke (${{ matrix.provider }})
    if: ${{ github.repository_owner == 'snowmead' }}
    strategy:
      fail-fast: false
      matrix:
        provider: [vercel, render, fly, netlify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh

      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Stripe CLI + projects plugin
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" \
            | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe
          stripe plugin install "projects@$(tr -d '[:space:]' < crates/stackless-stripe-projects/tests/fixtures/plugin-version.txt)"

      - name: Stripe Projects snapshot gate (pinned)
        run: |
          pinned=$(tr -d '[:space:]' < crates/stackless-stripe-projects/tests/fixtures/plugin-version.txt)
          installed=$(stripe projects --version | tr -d '[:space:]')
          if [ "$installed" != "$pinned" ]; then
            echo "::error::installed projects plugin $installed != pinned $pinned"; exit 1
          fi
          mise run stripe-refresh
          git diff --exit-code -- \
            crates/stackless-stripe-projects/tests/fixtures/command-surface.txt \
            crates/stackless-stripe-projects/tests/fixtures/plugin-version.txt \
            || { echo "::error::command surface is stale for plugin $pinned — run 'mise run stripe-refresh' and commit"; exit 1; }

      - name: Live ${{ matrix.provider }} up/status/logs/down
        env:
          STACKLESS_LIVE_SMOKE_REQUIRED: "1"
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: mise run smoke-${{ matrix.provider }}

  live-fleet:
    name: live-fleet (Turso)
    if: ${{ github.repository_owner == 'snowmead' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install tools (serial, retried)
        env:
          MISE_JOBS: "1"
        shell: bash
        run: bash .github/scripts/mise-install-retried.sh
      - name: Rust / Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Live Turso fleet-lock tests
        env:
          STACKLESS_LIVE_SMOKE_REQUIRED: "1"
          STACKLESS_STATE_URL: ${{ secrets.STACKLESS_STATE_URL }}
          STACKLESS_STATE_TOKEN: ${{ secrets.STACKLESS_STATE_TOKEN }}
        run: mise run smoke-fleet
