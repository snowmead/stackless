# Minimal local stack for agents: one static web service, no Docker, no secrets.
# Run from the stackless repo root:
#   stackless up --name demo --on local --file examples/agent-demo/stackless.toml
#
# Materializes examples/agent-demo/site from this repository (public GitHub ref).
[stack]
name = "agent-demo"

[services.web]
source      = { repo = "https://github.com/snowmead/stackless", ref = "main" }
root_origin = true
health      = { path = "/", contains = "stackless-agent-demo-ok" }

[services.web.local]
run = "python3 -m http.server $PORT --bind 127.0.0.1 --directory examples/agent-demo/site"
